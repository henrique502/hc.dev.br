<head>
  <meta charset="utf-8">

  {% capture title %}
    {%- if page.title -%}
      {{ page.title | strip_html | xml_escape  }} - {{ site.title | strip_html | xml_escape  }}
    {%- else -%}
      {{ site.title | strip_html | xml_escape }}
    {%- endif -%}
  {% endcapture %}

  <title>{{ title }}</title>
  <meta name="description" content="Henrique Schmidt — Tech Engineering Specialist & Solution Architect">
  <meta name="robots" content="none">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link href="https://cdn.lineicons.com/4.0/lineicons.css" crossorigin="anonymous" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet" />
</head>
